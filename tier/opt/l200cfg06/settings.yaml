scintillator_volume_name: liquid_argon
optmap_per_sipm: true
store_expected_pes: true

# these values are not tuned to a particular value
max_pes_per_hit_per_sipm: 5
max_pes_per_hit_combined: 100

# the maps are produced with SiPM PDE = 1; these factors are the per-channel
# photon detection efficiencies. They are fitted to p13 r003 Ar39 data (SiPM
# multiplicity windows [6,8) and >= 15, optical map rebinned to 10 mm voxels).
# Channels without a fitted value are off in p13 and use the default. The p.e.
# expectation above is stored at unit efficiency, so other efficiencies can
# still be applied afterwards.
optmap_scaling_factor:
  default: 0.3
  S002: 0.290
  S003: 0.336
  S007: 0.406
  S008: 0.416
  S011: 0.358
  S012: 0.406
  S015: 0.405
  S017: 0.403
  S020: 0.486
  S023: 0.279
  S025: 0.499
  S026: 0.518
  S029: 0.313
  S030: 0.469
  S031: 0.446
  S032: 0.196
  S036: 0.274
  S037: 0.383
  S040: 0.359
  S041: 0.470
  S042: 0.247
  S043: 0.276
  S046: 0.352
  S047: 0.480
  S048: 0.421
  S049: 0.418
  S050: 0.346
  S051: 0.427
  S052: 0.495
  S053: 0.450
  S055: 0.494
  S057: 0.213
  S061: 0.251
  S065: 0.334
  S068: 0.498
  S071: 0.326
  S073: 0.262
  S082: 0.432
  S083: 0.160
  S086: 0.406
  S087: 0.376
  S090: 0.185
  S094: 0.347
  S095: 0.128
  S096: 0.235
  S098: 0.354
  S099: 0.402

# these numbers are a guess
photoelectron_resolution_sigma: 0.3
time_resolution_in_ns: 16

# this needs to be on the low side since there can be many LAr energy
# depositions in some events
buffer_len: 10*MB
