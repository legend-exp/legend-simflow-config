# p13 has no HPGe detectors and never builds the hit tier; these values are read but
# never used.
buffer_len: 500*MB
dead_layer_fraction: 0.5

simulate_psd: false
simulate_psd_with_psl: false
two_pass_aoe_correction: false

eresmod_default:
  expression: FWHMLinear
  parameters:
    a: 0
    b: 0.003065

aoeresmod_default:
  expression: SigmaFit
  parameters:
    a: 0.0001
    b: 0
    c: 1

psdcuts_default:
  aoe:
    low_side: -1.5
    high_side: 3

aoemeanmod_default:
  single_template:
    expression: a * x + b
    pars:
      a: 0
      b: 1
  psl:
    expression: a * x + b
    pars:
      a: 0
      b: 1
