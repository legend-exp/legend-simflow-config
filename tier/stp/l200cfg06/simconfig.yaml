liquid_argon_Ar39:
  template: $_/templates/lar-instr-only.mac
  generator: ~defines:Ar39
  confinement: ~defines:lar_inside_wlsr
  primaries_per_job: 1_000_000
  number_of_jobs: 1

# The Cs137 capsule has the same geometry as the Th228 one, so every source slot below is
# declared Th228; which isotope is simulated comes from the generator.
sis1_z7820_slot2_Cs137:
